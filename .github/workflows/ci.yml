# Tests every push and pull request against the upstreams the POM names: a
# released pldb from Central, or its -SNAPSHOT from Central's snapshot
# repository while develop names one. Java 17 builds both modules; the domain
# compiles for release 8, the oracle vendors dddsample-core and needs 17. The
# Postgres tests run under Testcontainers on the runner's Docker.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Test
        run: mvn -B -ntp test
